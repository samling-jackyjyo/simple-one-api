services:
  simple-one-api:
    image: ghcr.io/fruitbars/simple-one-api:latest
    container_name: simple-one-api
    ports:
      - "9090:9090"
    volumes:
      - simple-one-api-data:/app/data
    environment:
      SIMPLE_ONE_API_DB: /app/data/config.db
    restart: unless-stopped

volumes:
  simple-one-api-data:
